[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["config", "shared", "accounts", "catalog", "inventory", "sales", "reporting", "settings"]

[project]
name = "stocktill-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<5.3",
    "djangorestframework>=3.15",
    "django-filter>=24.0",
    "drf-spectacular>=0.27",
    "django-cors-headers>=4.3",
    "psycopg[binary]>=3.1",
    "gunicorn>=22.0",
    "whitenoise>=6.6",
    "sentry-sdk[django]>=1.45",
    "dj-database-url>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "django-stubs>=5.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = "--cov --cov-report=term-missing"

[tool.importlinter]
root_package = "."

[[tool.importlinter.contracts]]
name = "Domain has no Django imports"
type = "forbidden"
source_modules = [
    "accounts.domain",
    "catalog.domain",
    "inventory.domain",
    "sales.domain",
    "reporting.domain",
]
forbidden_modules = [
    "django",
    "rest_framework",
]

[[tool.importlinter.contracts]]
name = "Contexts do not import each other"
type = "forbidden"
source_modules = [
    "accounts.application",
    "accounts.infrastructure",
    "catalog.application",
    "catalog.infrastructure",
    "inventory.application",
    "inventory.infrastructure",
    "sales.application",
    "sales.infrastructure",
    "reporting.application",
    "reporting.infrastructure",
]
forbidden_modules = [
    "accounts",
    "catalog",
    "inventory",
    "sales",
    "reporting",
]
ignore_imports = [
    "sales.infrastructure.adapters:catalog.application",
    "sales.infrastructure.adapters:inventory.application",
]
