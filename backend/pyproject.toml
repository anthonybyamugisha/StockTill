[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["config", "shared", "accounts", "catalog", "inventory", "sales", "payments", "shifts", "purchasing", "reporting", "settings"]

[project]
name = "stocktill-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<5.3",
    "djangorestframework>=3.15",
    "django-filter>=24.0",
    "drf-spectacular>=0.27",
    "django-cors-headers>=4.3",
    "psycopg[binary]>=3.1",
    "gunicorn>=22.0",
    "whitenoise>=6.6",
    "sentry-sdk[django]>=1.45",
    "dj-database-url>=2.1",
    "httpx>=0.27",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "django-stubs>=5.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "*.migrations.*",
    "*.tests.*",
    "config.*",
    "manage",
    "*.interfaces.*",
    "*.infrastructure.*",
]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = "--cov --cov-report=term-missing"

[tool.importlinter]
root_package = "."

[[tool.importlinter.contracts]]
name = "Domain has no Django imports"
type = "forbidden"
source_modules = [
    "accounts.domain",
    "catalog.domain",
    "inventory.domain",
    "sales.domain",
    "payments.domain",
    "shifts.domain",
    "purchasing.domain",
    "reporting.domain",
]
forbidden_modules = [
    "django",
    "rest_framework",
]

[[tool.importlinter.contracts]]
name = "Contexts do not import each other"
type = "forbidden"
source_modules = [
    "accounts.application",
    "accounts.infrastructure",
    "catalog.application",
    "catalog.infrastructure",
    "inventory.application",
    "inventory.infrastructure",
    "sales.application",
    "sales.infrastructure",
    "payments.application",
    "payments.infrastructure",
    "shifts.application",
    "shifts.infrastructure",
    "purchasing.application",
    "purchasing.infrastructure",
    "reporting.application",
    "reporting.infrastructure",
]
forbidden_modules = [
    "accounts",
    "catalog",
    "inventory",
    "sales",
    "payments",
    "shifts",
    "purchasing",
    "reporting",
]
ignore_imports = [
    "sales.infrastructure.adapters:catalog.infrastructure.models",
    "sales.infrastructure.adapters:inventory.application.commands",
    "sales.infrastructure.adapters:inventory.application.use_cases",
    "sales.infrastructure.adapters:inventory.domain.entities",
    "sales.infrastructure.adapters:inventory.infrastructure.repository",
    "sales.infrastructure.adapters:inventory.infrastructure.adapters",
    "inventory.infrastructure.adapters:catalog.infrastructure.models",
    "inventory.infrastructure.repository:catalog.infrastructure.models",
    "reporting.infrastructure.directories:accounts.infrastructure.models",
    "reporting.infrastructure.directories:catalog.infrastructure.models",
    "reporting.infrastructure.stock_levels:inventory.infrastructure.models",
    "reporting.infrastructure.queries.sales_summary:sales.infrastructure.models",
    "reporting.infrastructure.queries.top_products:sales.infrastructure.models",
    "reporting.infrastructure.queries.top_products:catalog.infrastructure.models",
    "reporting.infrastructure.queries.payment_methods:sales.infrastructure.models",
    "reporting.infrastructure.queries.daily_sales:sales.infrastructure.models",
    "reporting.infrastructure.queries.cashier_sales:sales.infrastructure.models",
    "reporting.infrastructure.queries.sales_report:sales.infrastructure.models",
    "reporting.infrastructure.queries.profit:sales.infrastructure.models",
    "reporting.infrastructure.queries.dashboard:sales.infrastructure.models",
    "reporting.infrastructure.queries.dashboard:catalog.infrastructure.models",
    "reporting.infrastructure.queries.inventory_report:catalog.infrastructure.models",
    "reporting.infrastructure.queries.inventory_report:inventory.infrastructure.models",
    "sales.infrastructure.adapters:shifts.infrastructure.models",
    "payments.infrastructure.sales_adapter:sales.application.commands",
    "payments.infrastructure.sales_adapter:sales.domain.entities",
    "payments.infrastructure.sales_adapter:sales.interfaces.api.container",
    "payments.infrastructure.sales_adapter:sales.infrastructure.adapters",
    "shifts.infrastructure.adapters:sales.infrastructure.models",
    "purchasing.infrastructure.adapters:inventory.application.commands",
    "purchasing.infrastructure.adapters:inventory.application.use_cases",
    "purchasing.infrastructure.adapters:inventory.domain.entities",
    "purchasing.infrastructure.adapters:inventory.infrastructure.adapters",
    "purchasing.infrastructure.adapters:inventory.infrastructure.repository",
    "catalog.infrastructure.adapters:inventory.application.commands",
    "catalog.infrastructure.adapters:inventory.application.use_cases",
    "catalog.infrastructure.adapters:inventory.domain.entities",
    "catalog.infrastructure.adapters:inventory.infrastructure.adapters",
    "catalog.infrastructure.adapters:inventory.infrastructure.repository",
]
