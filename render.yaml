services:
  - type: web
    name: stocktill-api
    env: python
    plan: starter
    rootDir: backend
    autoDeploy: true
    healthCheckPath: /api/v1/health/
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate && python manage.py seed_admin && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: stocktill-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://stock-till.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://stock-till.vercel.app
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@stocktill.com
      - key: DJANGO_SUPERUSER_PASSWORD
        value: "Anthony@2026.#"

databases:
  - name: stocktill-db
    plan: starter
    databaseName: stocktill
    user: stocktill
